[package]
name = "dwara-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.13"
anyhow = "1.0"
thiserror = "1.0"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# Add CORS support for Axum using tower-http
tower-http = { version = "0.5", features = ["cors"] }

# Enable async file handling
tokio-util = { version = "0.7", features = ["compat"] }
