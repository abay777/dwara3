services:
  app_db:  # Your application's database
    image: postgres:15
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dwara3"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${APP_DB_USER:-dwara3}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-dwara3}
      POSTGRES_DB: ${APP_DB_NAME:-dwara3}
    ports:
      - "${APP_DB_PORT:-5433}:5432"  # Note: using 5433 to avoid conflict with Airflow's Postgres
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      - ./db-init-scripts:/docker-entrypoint-initdb.d

  api:  # Your application service
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api/api:/app/api
    environment:
      - DB_HOST=app_db
      - DB_PORT=5432
      - DB_USER=${APP_DB_USER:-dwara3}
      - DB_PASSWORD=${APP_DB_PASSWORD:-dwara3}
      - DB_NAME=${APP_DB_NAME:-dwara3}
      - STAGING_FOLDER=${STAGING_FOLDER:-/staging}
      - PROXY_OUTPUT_FOLDER=${PROXY_OUTPUT_FOLDER:-/proxy} 
      - ATEMPO_API_URL=${ATEMPO_API_URL:-http://localhost:8000}
      - ATEMPO_API_KEY=${ATEMPO_API_KEY:-default-key}
    depends_on:
      app_db:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "24678:24678"  # For Vite's HMR
    volumes:
      - ./ui:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

volumes:
  app_postgres_data: